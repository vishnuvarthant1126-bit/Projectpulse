# Render Blueprint for the public demo API (read-only sample project, no API keys needed).
# Render dashboard -> New -> Blueprint -> pick this repo -> Apply.
# LLM_* settings are deliberately not set here: add them in the dashboard (Environment)
# so a Blueprint sync never overwrites them. Without them the demo runs with no API key.
services:
  - type: web
    name: projectpulse-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PUBLIC_DEMO
        value: "true"
      - key: PORT
        value: "8000"
      - key: DATA_DIR
        value: /data
